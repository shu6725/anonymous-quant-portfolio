<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative market-making backtest dashboard</title>
  <desc id="desc">A teaching example showing cumulative net PnL, drawdown, daily net PnL, trades per day and inventory for a hypothetical market-making backtest. It is not a live or research performance result.</desc>
  <rect width="1200" height="1120" fill="#ffffff"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif">
    <text x="66" y="62" fill="#172026" font-size="28" font-weight="700">Backtest dashboard: how I read the output</text>
    <text x="66" y="92" fill="#5c676f" font-size="16">Illustrative data only · normalized units · not live performance and not a strategy result</text>

    <rect x="66" y="128" width="1068" height="258" rx="2" fill="#fbfcfa" stroke="#d9dedb"/>
    <text x="94" y="166" fill="#172026" font-size="19" font-weight="700">1. Cumulative net PnL</text>
    <text x="94" y="191" fill="#5c676f" font-size="14">After fees and exit assumptions — direction matters less than the path that produced it.</text>
    <g stroke="#e4e8e5" stroke-width="1">
      <line x1="146" y1="224" x2="1094" y2="224"/><line x1="146" y1="265" x2="1094" y2="265"/><line x1="146" y1="306" x2="1094" y2="306"/><line x1="146" y1="347" x2="1094" y2="347"/>
    </g>
    <line x1="146" y1="347" x2="1094" y2="347" stroke="#8d9895" stroke-width="1"/>
    <g fill="#66716f" font-size="12" text-anchor="end">
      <text x="134" y="228">+120</text><text x="134" y="269">+80</text><text x="134" y="310">+40</text><text x="134" y="351">0</text>
    </g>
    <path d="M146 344 L196 337 L246 327 L296 333 L346 316 L396 303 L446 310 L496 286 L546 269 L596 279 L646 256 L696 260 L746 239 L796 252 L846 231 L896 221 L946 233 L996 213 L1046 202 L1094 189 L1094 347 L146 347 Z" fill="#0f5966" opacity=".11"/>
    <path d="M146 344 L196 337 L246 327 L296 333 L346 316 L396 303 L446 310 L496 286 L546 269 L596 279 L646 256 L696 260 L746 239 L796 252 L846 231 L896 221 L946 233 L996 213 L1046 202 L1094 189" fill="none" stroke="#0f5966" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1094" cy="189" r="5" fill="#0f5966"/>
    <text x="1088" y="178" fill="#0f5966" font-size="13" font-weight="700" text-anchor="end">+154</text>
    <g fill="#66716f" font-size="12" text-anchor="middle">
      <text x="146" y="371">D1</text><text x="396" y="371">D6</text><text x="646" y="371">D11</text><text x="896" y="371">D16</text><text x="1094" y="371">D20</text>
    </g>

    <rect x="66" y="414" width="1068" height="210" rx="2" fill="#fbfcfa" stroke="#d9dedb"/>
    <text x="94" y="452" fill="#172026" font-size="19" font-weight="700">2. Drawdown from the running peak</text>
    <text x="94" y="477" fill="#5c676f" font-size="14">The depth and recovery time show the price paid for the cumulative curve.</text>
    <line x1="146" y1="511" x2="1094" y2="511" stroke="#8d9895" stroke-width="1"/>
    <g stroke="#e4e8e5" stroke-width="1"><line x1="146" y1="548" x2="1094" y2="548"/><line x1="146" y1="585" x2="1094" y2="585"/></g>
    <g fill="#66716f" font-size="12" text-anchor="end"><text x="134" y="515">0</text><text x="134" y="552">−20</text><text x="134" y="589">−40</text></g>
    <path d="M146 511 L196 511 L246 511 L296 522 L346 511 L396 511 L446 523 L496 511 L546 511 L596 522 L646 511 L696 516 L746 511 L796 524 L846 511 L896 511 L946 522 L996 511 L1046 511 L1094 511 L1094 511 L146 511 Z" fill="#b44b3d" opacity=".22"/>
    <path d="M146 511 L196 511 L246 511 L296 522 L346 511 L396 511 L446 523 L496 511 L546 511 L596 522 L646 511 L696 516 L746 511 L796 524 L846 511 L896 511 L946 522 L996 511 L1046 511 L1094 511" fill="none" stroke="#b44b3d" stroke-width="3" stroke-linejoin="round"/>
    <line x1="796" y1="524" x2="796" y2="548" stroke="#b44b3d" stroke-width="1.5"/>
    <text x="796" y="567" fill="#b44b3d" font-size="13" font-weight="700" text-anchor="middle">max drawdown</text>
    <g fill="#66716f" font-size="12" text-anchor="middle"><text x="146" y="607">D1</text><text x="396" y="607">D6</text><text x="646" y="607">D11</text><text x="896" y="607">D16</text><text x="1094" y="607">D20</text></g>

    <rect x="66" y="652" width="522" height="388" rx="2" fill="#fbfcfa" stroke="#d9dedb"/>
    <text x="94" y="690" fill="#172026" font-size="19" font-weight="700">3. Daily net PnL</text>
    <text x="94" y="715" fill="#5c676f" font-size="14">Look for dependence on a few days, not only the total.</text>
    <line x1="108" y1="875" x2="554" y2="875" stroke="#8d9895" stroke-width="1"/>
    <g>
      <rect x="124" y="850" width="12" height="25" fill="#0f5966"/><rect x="145" y="839" width="12" height="36" fill="#0f5966"/><rect x="166" y="832" width="12" height="43" fill="#0f5966"/><rect x="187" y="875" width="12" height="20" fill="#b44b3d"/><rect x="208" y="827" width="12" height="48" fill="#0f5966"/>
      <rect x="229" y="840" width="12" height="35" fill="#0f5966"/><rect x="250" y="875" width="12" height="17" fill="#b44b3d"/><rect x="271" y="814" width="12" height="61" fill="#0f5966"/><rect x="292" y="830" width="12" height="45" fill="#0f5966"/><rect x="313" y="875" width="12" height="21" fill="#b44b3d"/>
      <rect x="334" y="810" width="12" height="65" fill="#0f5966"/><rect x="355" y="866" width="12" height="9" fill="#0f5966"/><rect x="376" y="807" width="12" height="68" fill="#0f5966"/><rect x="397" y="875" width="12" height="23" fill="#b44b3d"/><rect x="418" y="817" width="12" height="58" fill="#0f5966"/>
      <rect x="439" y="843" width="12" height="32" fill="#0f5966"/><rect x="460" y="875" width="12" height="17" fill="#b44b3d"/><rect x="481" y="809" width="12" height="66" fill="#0f5966"/><rect x="502" y="840" width="12" height="35" fill="#0f5966"/><rect x="523" y="826" width="12" height="49" fill="#0f5966"/>
    </g>
    <g fill="#66716f" font-size="12"><text x="108" y="853" text-anchor="end">+20</text><text x="108" y="879" text-anchor="end">0</text><text x="108" y="902" text-anchor="end">−20</text></g>
    <g fill="#66716f" font-size="12" text-anchor="middle"><text x="130" y="922">1</text><text x="235" y="922">6</text><text x="340" y="922">11</text><text x="445" y="922">16</text><text x="529" y="922">20</text></g>
    <rect x="94" y="958" width="12" height="12" fill="#0f5966"/><text x="114" y="969" fill="#5c676f" font-size="12">profitable day</text><rect x="212" y="958" width="12" height="12" fill="#b44b3d"/><text x="232" y="969" fill="#5c676f" font-size="12">losing day</text>
    <text x="94" y="1007" fill="#5c676f" font-size="13">Question: would the result still hold without its best few days?</text>

    <rect x="612" y="652" width="522" height="388" rx="2" fill="#fbfcfa" stroke="#d9dedb"/>
    <text x="640" y="690" fill="#172026" font-size="19" font-weight="700">4. Activity and inventory</text>
    <text x="640" y="715" fill="#5c676f" font-size="14">PnL needs a believable amount of participation and risk.</text>
    <g stroke="#e4e8e5" stroke-width="1"><line x1="650" y1="759" x2="1102" y2="759"/><line x1="650" y1="804" x2="1102" y2="804"/><line x1="650" y1="849" x2="1102" y2="849"/><line x1="650" y1="894" x2="1102" y2="894"/></g>
    <g fill="#66716f" font-size="12" text-anchor="end"><text x="640" y="763">600</text><text x="640" y="808">400</text><text x="640" y="853">200</text><text x="640" y="898">0</text></g>
    <path d="M664 846 L687 814 L710 830 L733 785 L756 802 L779 770 L802 781 L825 754 L848 776 L871 742 L894 760 L917 733 L940 750 L963 721 L986 738 L1009 711 L1032 727 L1055 699 L1078 716 L1101 687" fill="none" stroke="#276c8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#276c8c"><circle cx="664" cy="846" r="3"/><circle cx="733" cy="785" r="3"/><circle cx="802" cy="781" r="3"/><circle cx="871" cy="742" r="3"/><circle cx="940" cy="750" r="3"/><circle cx="1009" cy="711" r="3"/><circle cx="1101" cy="687" r="3"/></g>
    <path d="M664 858 L687 849 L710 864 L733 839 L756 853 L779 834 L802 849 L825 828 L848 843 L871 836 L894 847 L917 822 L940 840 L963 830 L986 845 L1009 818 L1032 836 L1055 826 L1078 840 L1101 820" fill="none" stroke="#a87824" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="654" y="944" fill="#276c8c" font-size="13" font-weight="700">— trades/day</text><text x="793" y="944" fill="#a87824" font-size="13" font-weight="700">- - max |inventory|</text>
    <g fill="#66716f" font-size="12" text-anchor="middle"><text x="664" y="922">1</text><text x="779" y="922">6</text><text x="894" y="922">11</text><text x="1009" y="922">16</text><text x="1101" y="922">20</text></g>
    <text x="640" y="980" fill="#5c676f" font-size="13">Question: is PnL coming from a scalable level of activity without unacceptable inventory tails?</text>
    <text x="640" y="1007" fill="#5c676f" font-size="13">For short-horizon MM, this panel is often as important as the equity curve.</text>

    <line x1="66" y1="1074" x2="1134" y2="1074" stroke="#d9dedb"/>
    <text x="66" y="1102" fill="#5c676f" font-size="13">A dashboard is a starting point, not a proof. The next checks are fill assumptions, costs, parameter sensitivity, and locked out-of-sample performance.</text>
  </g>
</svg>
