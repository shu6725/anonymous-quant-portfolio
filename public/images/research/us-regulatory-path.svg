<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">United States regulatory path</title>
  <desc id="desc">A diagram showing existing statutes, agency interpretation and product-specific review as three distinct paths.</desc>
  <style>
    .bg{fill:#fbfbf8}.panel{fill:#fff;stroke:#d9dedb;stroke-width:2}.ink{fill:#172026}.muted{fill:#5c676f}.accent{fill:#0f5966}.headline{font:500 34px Georgia,serif}.label{font:700 24px system-ui,sans-serif}.body{font:400 18px system-ui,sans-serif}.small{font:700 15px system-ui,sans-serif;letter-spacing:1.2px}
  </style>
  <rect class="bg" width="1200" height="430"/>
  <text x="60" y="65" class="headline ink">US: no single switch turns the market on</text>
  <text x="60" y="98" class="body muted">The practical question is which legal path applies to the asset, transaction and product.</text>
  <g transform="translate(60 155)">
    <rect class="panel" width="315" height="190"/><text x="26" y="44" class="small accent">01</text><text x="26" y="87" class="label ink">Existing statutes</text><text x="26" y="125" class="body muted">securities and commodities</text><text x="26" y="154" class="body muted">law remains relevant</text>
  </g>
  <g transform="translate(442 155)">
    <rect class="panel" width="315" height="190"/><text x="26" y="44" class="small accent">02</text><text x="26" y="87" class="label ink">Interpretation</text><text x="26" y="125" class="body muted">asset and transaction</text><text x="26" y="154" class="body muted">classification</text>
  </g>
  <g transform="translate(824 155)">
    <rect class="panel" width="315" height="190"/><text x="26" y="44" class="small accent">03</text><text x="26" y="87" class="label ink">Product review</text><text x="26" y="125" class="body muted">venue, contract, clearing</text><text x="26" y="154" class="body muted">and customer design</text>
  </g>
  <path d="M375 250H420" stroke="#0f5966" stroke-width="3"/><path d="M420 250l-11-7v14z" class="accent"/>
  <path d="M757 250H802" stroke="#0f5966" stroke-width="3"/><path d="M802 250l-11-7v14z" class="accent"/>
  <text x="60" y="395" class="body muted">A product name does not replace a review of its legal entity, contract terms and market venue.</text>
</svg>
